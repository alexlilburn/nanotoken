[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nanotoken"
description = "WordPiece tokenization at GB/s, exactly matching HuggingFace tokenizers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alex Lilburn" }]
keywords = ["tokenizer", "wordpiece", "bert", "nlp", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]
dependencies = ["numpy>=1.24"]

[project.scripts]
nanotoken = "nanotoken._cli:main"

[dependency-groups]
dev = [
    "maturin>=1.9",
    "pytest>=8",
    "ruff>=0.15",
    "tokenizers>=0.21",
    "transformers>=4.45",
]
torch = ["torch>=2.2"]

[tool.maturin]
module-name = "nanotoken.nanotoken_rs"
features = ["python"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs to download tokenizers from the HuggingFace Hub"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
